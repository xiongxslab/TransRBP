[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transrbp-m6a"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    "pyBigWig",
    "captum",
    "tqdm",
    "biopython",
    "pyfaidx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "data*", "training*", "evaluation*", "interpretation*", "demethylation*", "mutagenesis*"]
