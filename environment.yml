name: transrbp
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults
  - nvidia
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - blast=2.17.0        # BLAST+ (makeblastdb, blastn) for the no-homology splits and RBPNet benchmark
  - pip
  - pip:
    - numpy
    - scipy
    - pandas
    - h5py
    - pyBigWig
    - biopython
    - pyfaidx
    - captum
    - tqdm
    - tensorboard
    - matplotlib
